services:
  lastfm:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: last-fm-lastfm:latest
    pull_policy: never
    container_name: lastfm-app
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LASTFM_API_KEY=${LASTFM_API_KEY}
      - FREESOUND_API_KEY=${FREESOUND_API_KEY}
      - AUTOUPDATE_INTERVAL_MS=${AUTOUPDATE_INTERVAL_MS:-60000}
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - lastfm_data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const h=require('http');
          const urls=['/health','/api/studio/rig','/api/normalization/status'];
          let ok=0;
          urls.forEach(u=>h.get('http://localhost:3000'+u,r=>{if(r.statusCode===200&&++ok===urls.length)process.exit(0);}).on('error',()=>process.exit(1)));
          setTimeout(()=>process.exit(1),5000);
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/node_modules/.cache
      - /app/uploads:mode=1777
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lastfm.rule=Host(`localhost`)"
      - "traefik.http.services.lastfm.loadbalancer.server.port=3000"
      - "com.lastfm.description=Last.fm Desktop with Studio Enhancements"
      - "com.lastfm.version=5.3.0"

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: lastfm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - lastfm
    profiles:
      - production
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Optional: Redis for caching
  redis:
    image: redis:alpine
    container_name: lastfm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles:
      - production
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

networks:
  default:
    name: lastfm-network
    driver: bridge

volumes:
  redis_data:
    driver: local
  lastfm_data:
    driver: local
