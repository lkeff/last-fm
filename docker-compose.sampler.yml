---
# Professional Sampler Database Stack
# Storage: 5 GB initial → expandable to 50 GB by adjusting volume driver options.
# Usage:
#   docker compose -f docker-compose.sampler.yml up -d
#   docker compose -f docker-compose.sampler.yml exec postgres psql -U postgres -d sampler -f /migrations/001_sampler_schema.sql

services:

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sampler-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       sampler
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${SAMPLER_POSTGRES_PASSWORD:-change_me_in_production}
      # Performance tuning for audio metadata workloads
      # shared_buffers  = 25% of RAM; adjust for your host
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
    command: >
      postgres
        -c shared_buffers=512MB
        -c effective_cache_size=1536MB
        -c maintenance_work_mem=128MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c work_mem=16MB
        -c max_worker_processes=8
        -c max_parallel_workers_per_gather=4
        -c max_parallel_workers=8
        -c max_parallel_maintenance_workers=4
        -c max_wal_size=2GB
        -c min_wal_size=80MB
        -c log_min_duration_statement=1000
        -c log_checkpoints=on
    volumes:
      # sampler_data: primary audio library metadata (resize from 5 GB to 50 GB by updating size limits)
      - sampler_data:/var/lib/postgresql/data
      # Mount migration SQL so it can be applied on first run
      - ./db/migrations:/migrations:ro
    ports:
      - "${SAMPLER_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sampler"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ─── Schema migrator (one-shot) ───────────────────────────────────────────────
  migrate:
    image: postgres:16-alpine
    container_name: sampler-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST:     postgres
      PGPORT:     5432
      PGDATABASE: sampler
      PGUSER:     postgres
      PGPASSWORD: ${SAMPLER_POSTGRES_PASSWORD:-change_me_in_production}
    volumes:
      - ./db/migrations:/migrations:ro
    command: >
      sh -c "
        psql -f /migrations/001_sampler_schema.sql &&
        echo 'Migration 001 applied successfully'
      "
    restart: on-failure

  # ─── last-fm app (with sampler env) ──────────────────────────────────────────
  lastfm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sampler-lastfm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:              production
      PORT:                  3000
      LASTFM_API_KEY:        ${LASTFM_API_KEY}
      FREESOUND_API_KEY:     ${FREESOUND_API_KEY:-}
      # Sampler DB connection
      SAMPLER_DB_HOST:       postgres
      SAMPLER_DB_PORT:       5432
      SAMPLER_DB_NAME:       sampler
      SAMPLER_DB_USER:       sampler_app
      SAMPLER_DB_PASSWORD:   ${SAMPLER_APP_PASSWORD:-sampler_app_pw}
      SAMPLER_DB_POOL_MAX:   10
    env_file:
      - .env
    ports:
      - "${LASTFM_PORT:-3004}:3000"
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - lastfm_data:/app/data
      # Mount sample files directory (audio files themselves; metadata lives in PG)
      - ${SAMPLE_FILES_DIR:-./samples}:/app/samples:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const h=require('http');
          h.get('http://localhost:3000/health',r=>{process.exit(r.statusCode===200?0:1);}).on('error',()=>process.exit(1));
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # ─── pgAdmin (optional, dev only) ─────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sampler-pgadmin
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL:-admin@sampler.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    security_opt:
      - no-new-privileges:true

volumes:
  # sampler_data: primary PostgreSQL data volume
  # To expand from 5 GB to 50 GB:
  #   1. If using local driver: ensure host filesystem has space; PG will grow automatically
  #   2. If using named volume on cloud (AWS EBS, GCP PD): resize the backing disk and run:
  #      docker volume inspect sampler_data → find Mountpoint
  #      resize2fs /dev/... (for ext4) or xfs_growfs (for xfs) after disk resize
  #   3. For local dev: no action needed — PG grows automatically up to host disk limit
  sampler_data:
    driver: local
    driver_opts:
      type: none
      device: ${SAMPLER_DATA_DIR:-./data/sampler}
      o: bind

  lastfm_data:
    driver: local

  pgadmin_data:
    driver: local

networks:
  default:
    name: sampler-network
