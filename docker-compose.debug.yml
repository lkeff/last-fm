version: '3.8'

services:
  lastfm:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: lastfm:debug
    container_name: lastfm-debug
    restart: "no"
    ports:
      - "3000:3000"
      - "9229:9229" # Node.js debug port
    environment:
      - NODE_ENV=development
      - LASTFM_API_KEY=${LASTFM_API_KEY}
      - DEBUG=lastfm:*
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
    command: [ "node", "--inspect=0.0.0.0:9229", "main.js" ]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M
