# Discord bot worker: outbound gateway connection only, no public HTTP service.
# Set secrets with: fly secrets set DISCORD_TOKEN=... LASTFM_API_KEY=...
app = "lastfm-discord-bot"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  COUNTDOWN_STORE_PATH = "/data/countdowns.json"

[mounts]
  source = "countdown_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
