version: '3.8'

services:
  lastfm:
    build:
      context: .
      dockerfile: ./Dockerfile.simple
    image: lastfm:latest
    container_name: lastfm-app
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - LASTFM_API_KEY=${LASTFM_API_KEY}
      - PORT=3000
      - AUTOUPDATE_INTERVAL_MS=${AUTOUPDATE_INTERVAL_MS:-60000}
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - lastfm_data:/app/data
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/uploads:mode=1777
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Optional: Add a reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: lastfm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - lastfm
    profiles:
      - production

volumes:
  lastfm_data:
    driver: local
